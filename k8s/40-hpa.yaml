# One Horizontal Pod Autoscaler per app.
# Rule: keep average CPU at about 50% of each pod's CPU *request* (100m), between 2 and 5 pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: action-messages
  namespace: techpathway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: action-messages
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300; shortened so the demo finishes sooner
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: techpathway-warehouse
  namespace: techpathway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techpathway-warehouse
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: main-app
  namespace: techpathway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: main-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
