apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app
  namespace: techpathway
  labels:
    app: main-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-app
  template:
    metadata:
      labels:
        app: main-app
    spec:
      containers:
        - name: main-app
          image: ${ECR_REGISTRY}/main-app:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5111
          envFrom:
            - configMapRef:
                name: main-app-config
            - secretRef:
                name: main-app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5111
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5111
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
