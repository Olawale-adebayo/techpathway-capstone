apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-messages
  namespace: techpathway
  labels:
    app: action-messages
spec:
  replicas: 1
  selector:
    matchLabels:
      app: action-messages
  template:
    metadata:
      labels:
        app: action-messages
    spec:
      containers:
        - name: action-messages
          image: ${ECR_REGISTRY}/action-messages:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: action-messages-config
            - secretRef:
                name: action-messages-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
